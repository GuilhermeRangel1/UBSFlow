services:
  postgres:
    image: postgres:16-alpine
    container_name: ubsflow-postgres
    environment:
      POSTGRES_DB: ubsflow
      POSTGRES_USER: ubsflow
      POSTGRES_PASSWORD: ubsflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
