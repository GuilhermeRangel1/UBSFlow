services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ubsflow-frontend
    depends_on:
      - api
    environment:
      VITE_PROXY_TARGET: http://api:8080
    ports:
      - "3000:3000"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubsflow-api
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ubsflow;Username=ubsflow;Password=ubsflow
    ports:
      - "5000:8080"

  postgres:
    image: postgres:16-alpine
    container_name: ubsflow-postgres
    environment:
      POSTGRES_DB: ubsflow
      POSTGRES_USER: ubsflow
      POSTGRES_PASSWORD: ubsflow
    ports:
      - "5432:5432"
    volumes:
      - ubsflow_postgres_data:/var/lib/postgresql/data

volumes:
  ubsflow_postgres_data:
